# ============================================================================
# Chronicle Docker Compose — LOCAL BUILD OVERRIDE
# ============================================================================
# Use this ONLY when you want to run Chronicle from your working tree instead
# of from the published GHCR image:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build chronicle
#
# `make docker-build` and `make docker-all-local` wrap those two commands.
#
# Separate file because one service can't carry both `image:` and `build:`
# (two producers for one tag). This override renames the image to
# `chronicle:local` (the published tag's only producer is CI) and sets
# `pull_policy: build` so compose doesn't try to pull `chronicle:local` from
# Docker Hub.
#
# Build args below match what CI passes (.github/workflows/ci.yml). Optional —
# an unstamped local image still self-identifies via the VCS revision Go
# embeds during the build — but passing them makes `docker image inspect
# chronicle:local` agree with the binary.
# ============================================================================

services:
  chronicle:
    image: chronicle:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Left empty unless you export them first, e.g.
        #   export VCS_REF=$(git rev-parse HEAD)
        #   export BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        # Empty is honest: it records that provenance was not captured,
        # rather than inventing a plausible-looking value.
        VCS_REF: ${VCS_REF:-}
        BUILD_DATE: ${BUILD_DATE:-}
        CHRONICLE_VERSION: ${CHRONICLE_VERSION:-}
